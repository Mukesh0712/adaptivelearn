# Render Blueprint: Render reads this file to create and configure the service.
# One web service runs Express, which serves both the API (/api/*) and the
# built React app from the same address.
services:
  - type: web
    name: adaptivelearn
    runtime: node
    plan: free
    region: singapore # closest Render region to India
    branch: main
    autoDeploy: true # redeploy on every push to main
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Secrets you type in the Render dashboard (never committed to Git)
      - key: MONGODB_URI
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Random secrets generated by Render once, then kept
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Non-secret settings
      - key: TRUST_PROXY
        value: "1"
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 1d
      - key: REMEMBER_ME_TTL
        value: 30d
      - key: PASSWORD_RESET_TTL_MINUTES
        value: "30"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      # CLIENT_ORIGIN and VITE_SITE_URL default to Render's own address
      # (RENDER_EXTERNAL_URL). Set them only when you add a custom domain.
